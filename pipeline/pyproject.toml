[project]
name = "tgbp-pipeline"
version = "0.1.0"
description = "TGBP offline data pipeline — แปลงข้อมูลงบประมาณดิบเป็นชุดข้อมูลสำหรับเว็บ (รันบนเครื่อง dev เท่านั้น)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pdfplumber>=0.11",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.scripts]
tgbp = "tgbp_pipeline.cli:app"

# รองรับทั้ง pip (`pip install -e ".[dev]"`) และ uv (`uv sync` ใช้ [dependency-groups])
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgbp_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "rawdata: ต้องมีโฟลเดอร์ข้อมูลดิบจริงบนเครื่อง (skip อัตโนมัติถ้าไม่มี)",
]
