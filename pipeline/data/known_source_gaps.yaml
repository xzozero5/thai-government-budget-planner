# known_source_gaps.yaml — ช่องว่างของข้อมูลดิบที่ "ยืนยันแล้วว่ามีจริง" แต่ตัดสินใจเก็บข้อมูลไว้ใช้ต่อ
# (แทนที่จะตัดทิ้งทั้งปี) ตัดสินใจโดย main thread ร่วมกับ data-engineer 19 ก.ย. 2569 (ดู ADR-004)
#
# `tgbp_pipeline.validate.check_v1` ใช้ไฟล์นี้: ถ้าปี/dataset ตรงกับ entry และ coverage ที่คำนวณสด
# ตอนนี้อยู่ในกรอบ ± 0.5 จุด % ของ `coverage_pct` ที่บันทึกไว้ → สถานะ `source_incomplete`
# (ไม่ใช่ "pass" แต่ก็ไม่ทำให้ `tgbp validate` exit 1 — แค่เตือนเด่น ๆ) ถ้า coverage เปลี่ยนไปเกินกรอบ
# นี้ → ถือว่าโค้ด/ไฟล์ต้นทางเปลี่ยนไปโดยไม่ได้ตั้งใจ → fail จริง (ต้องตรวจสอบใหม่)
#
# หน่วยเงินในไฟล์นี้ = ล้านบาท (ตามไฟล์ PBO ต้นทาง) เพื่อให้เทียบกับ oracle.json ได้ตรง ๆ

pbo_disbursement:
  2562:
    oracle_total_mthb: 3000000.0 # Grand Total คอลัมน์ "พรบ." ในไฟล์ (ตรงกับ พ.ร.บ. งบประมาณปี 2562 จริง)
    extracted_total_mthb: 2377340.247 # sum("amount_thb") ของ .cache/pbo/2562.parquet / 1e6 (หลัง null แถว corrupt_row แล้ว)
    coverage_pct: 79.24
    # กระทรวงที่ "มี" ทั้งปี 2561 และ 2563 (จาก .cache/pbo/2561.parquet, 2563.parquet) แต่ไม่มีแถวเลยในปี 2562
    missing_ministries:
      - กระทรวงกลาโหม
      - กระทรวงการคลัง
      - กระทรวงการต่างประเทศ
      - กระทรวงการท่องเที่ยวและกีฬา
      - กระทรวงการพัฒนาสังคมและความมั่นคงของมนุษย์
      - รายจ่ายเพื่อชดใช้เงินคงคลัง
    # กระทรวงที่มีข้อมูลปี 2562 แต่ยอด "พรบ." < 50% ของค่าเฉลี่ย (2561, 2563) — คำนวณจริงจาก cache
    partial_ministries:
      - กระทรวงเกษตรและสหกรณ์ # 2562=23,443.4 ล้าน เทียบเฉลี่ย(2561=122,572.8 / 2563=108,074.2) = 20.3%
      - สำนักนายกรัฐมนตรี # 2562=2,413.6 ล้าน เทียบเฉลี่ย(2561=33,874.7 / 2563=38,783.6) = 6.6%
    # ตรวจแล้วว่า "ยอดหาย" ของกระทรวงนี้ตามสูตรเชิงกล (< 50%) แต่เป็นผลจากการเปลี่ยนชื่อกระทรวง
    # ไม่ใช่ gap จริง — จึงไม่ใส่ใน partial_ministries: "กระทรวงวิทยาศาสตร์และเทคโนโลยี" ยังใช้ชื่อเดิม
    # ต่อเนื่องปี 2561 (14,275.4M) และ 2562 (14,727.6M) ตรงกันดี ก่อนถูกยุบรวมเป็น
    # "กระทรวงการอุดมศึกษา วิทยาศาสตร์ วิจัยและนวัตกรรม" (อว.) ในปี 2563 (126,392.1M — รวมงบส่วนอื่นเพิ่ม)
    excluded_from_partial_due_to_rename:
      - กระทรวงการอุดมศึกษา วิทยาศาสตร์ วิจัยและนวัตกรรม
    verified_by: "main thread + data-engineer 2569-09-19"
    note: >
      PBO/2562.xlsx (sheet "เบิกจ่ายภาพรวมทุกมิติ (3)") ขาดข้อมูลทั้งกระทรวงของ 6 รายการข้างต้น
      (ไม่มีแถวเลย) และมีข้อมูลไม่ครบของกระทรวงเกษตรฯ/สำนักนายกฯ ทั้งที่ Grand Total ในไฟล์ระบุ
      3,000,000 ล้านบาท (ตรงกับ พ.ร.บ. งบประมาณปี 2562 จริง) — ยังไม่ทราบสาเหตุที่แท้จริง
      (สงสัยว่าไฟล์ export จาก PBO ต้นทางไม่สมบูรณ์) ตัดสินใจ**เก็บข้อมูลปี 2562 ไว้ใช้งานต่อ**
      แต่ต้องแสดงคำเตือนชัดเจนใน UI/validation ทุกครั้ง (ดู docs/decisions/ADR-004.md).
      แยกจากปัญหาแถว 226-227 ที่คอลัมน์เงินเลื่อน/เสีย (พรบ.=607,006,457,005 ล้านบาท) ซึ่งถูก
      null ทิ้งเป็น quality_flag=corrupt_row ไปแล้วก่อนคำนวณ extracted_total_mthb นี้ (ไม่ใช่สาเหตุ
      ของช่องว่าง 20.8% ข้างต้น — ตรวจแยกกันแล้วว่าเป็นคนละปัญหา)
