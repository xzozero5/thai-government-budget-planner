# T-306 — ชุดโจทย์ eval (05-FEATURES.md §6) — 20 โจทย์ครบตามสเปก
#
# หมายเหตุการอ่านไฟล์นี้:
# - `run_tier: core8` = 8 โจทย์ที่รันจริงรอบแรกของ T-306 (ตาม docs/api-budget.md เพดาน 1.80 USD)
#   ที่เหลือ `run_tier: extended` รายงานเป็น `not_run (budget)` ใน docs/eval-report.md รอบนี้
# - `model`/`effort` ผูกกับ ADR-006: Haiku 4.5 ห้ามส่ง `effort` (runner/agent ไม่ส่งให้อยู่แล้วเพราะ
#   `getModelCapability(...).supportsEffort === false`) — ใส่ `effort` เฉพาะโจทย์ที่ `model` เป็น Sonnet
# - `web_search: true` มีแค่ 2 โจทย์ (equip-notebook-office, it-system-document-management) ตาม
#   docs/api-budget.md "web search ≤ ครั้งที่จำเป็น" — ทั้งคู่อยู่ extended (ไม่รันรอบนี้) เพื่อคุมความ
#   ซับซ้อนของ core8 รอบแรก (จะเปิดในรอบ T-604/extended run ถัดไป)
# - `prompt_sequence` ออกแบบให้จบใน ≤ 2 user turns เสมอ: ข้อความแรกให้ requirement ครบ + วรรคท้าย
#   "ถ้าขาดข้อมูลให้ใช้สมมติฐานที่เหมาะสมแล้วสรุปเป็นข้อเสนอเลย"; turn ที่ 2 (ใช้เฉพาะเมื่อโมเดลยังถามต่อ)
#   คือ "ใช้สมมติฐานที่เหมาะสม แล้วสรุปเลย" คำต่อคำ — runner ส่ง turn 2 เสมอถ้า `prompt_sequence` มี 2 ข้อความ
#   (ไม่ตรวจว่าโมเดล "ถามจริงไหม" ก่อนส่ง เพื่อความง่ายของ dry-run/real run รอบแรก)
# - `expected.must_call_tools`/`must_not_call_tools` ใช้ชื่อ tool ตรงกับ `ai/tools/index.ts#TOOL_REGISTRY`
# - `expected.must_not_claim`/`must_mention` เป็น regex (ECMAScript, ไม่มี flag พิเศษ — score.mjs รันด้วย
#   `new RegExp(pattern, 'u')`) ตรวจกับ (ก) ข้อความ assistant ที่ต่อกันทุก turn (ข) `JSON.stringify(proposal)`
#   ถ้ามี — เป็น judge แบบ rule-based ตาม ADR-006 ข้อ 10/07-TESTING.md §4 ไม่ใช่ LLM-as-judge
# - `must_cite_dataset` เป็น "ชุดที่ยอมรับได้" (permissive — มีสักตัวในผลลัพธ์ก็พอ) เพราะยืนยัน dataset
#   จริงของทุก source_id ที่โมเดลจะเลือกอ้างล่วงหน้าไม่ได้ทั้งหมด (ตรวจ grounding คร่าว ๆ ด้วย
#   `web/public/data/catalog/items.json.gz` ในสรุปงานนี้ — ดู PR/รายงานปิดงาน T-306 จังหวะที่ 1)

