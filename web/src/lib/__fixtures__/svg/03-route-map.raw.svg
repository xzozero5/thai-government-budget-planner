<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620">
  <rect x="0" y="0" width="800" height="620" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="400" y="35" font-family="Sarabun, sans-serif" font-size="22" fill="#2D2A4A" text-anchor="middle" font-weight="bold">
    แผนผังเส้นทาง กรุงเทพมหานคร - จังหวัดนครนายก
  </text>
  <text x="400" y="58" font-family="Sarabun, sans-serif" font-size="14" fill="#6B7280" text-anchor="middle">
    ระยะทางรวมโดยประมาณ 105 กิโลเมตร (ทางหลวงหมายเลข 305 และ 33)
  </text>

  <!-- Map frame -->
  <rect x="40" y="80" width="720" height="470" fill="#F4F5F8" stroke="#6B7280" stroke-width="1.5"/>

  <!-- Road: BKK to Rangsit (Highway 1 approx) -->
  <line x1="150" y1="500" x2="260" y2="420" stroke="#6B7280" stroke-width="6" stroke-linecap="round"/>
  <text x="165" y="470" font-family="Sarabun, sans-serif" font-size="13" fill="#2D2A4A">ทล.1 ~35 กม.</text>

  <!-- Road: Rangsit to Ongkharak (Highway 305) -->
  <line x1="260" y1="420" x2="460" y2="270" stroke="#1F4E79" stroke-width="7" stroke-linecap="round"/>
  <text x="300" y="360" font-family="Sarabun, sans-serif" font-size="13" fill="#1F4E79" font-weight="bold">ทล.305 ~40 กม.</text>

  <!-- Road: Ongkharak to Nakhon Nayok (Highway 33) -->
  <line x1="460" y1="270" x2="610" y2="170" stroke="#A51931" stroke-width="7" stroke-linecap="round"/>
  <text x="500" y="215" font-family="Sarabun, sans-serif" font-size="13" fill="#A51931" font-weight="bold">ทล.33 ~30 กม.</text>

  <!-- City: Bangkok -->
  <circle cx="150" cy="500" r="10" fill="#A51931" stroke="#2D2A4A" stroke-width="1.5"/>
  <text x="120" y="530" font-family="Sarabun, sans-serif" font-size="15" fill="#2D2A4A" font-weight="bold">กรุงเทพมหานคร</text>

  <!-- City: Rangsit -->
  <circle cx="260" cy="420" r="8" fill="#0F7B6C" stroke="#2D2A4A" stroke-width="1.5"/>
  <text x="230" y="405" font-family="Sarabun, sans-serif" font-size="14" fill="#2D2A4A">รังสิต</text>

  <!-- City: Ongkharak -->
  <circle cx="460" cy="270" r="8" fill="#0F7B6C" stroke="#2D2A4A" stroke-width="1.5"/>
  <text x="430" y="255" font-family="Sarabun, sans-serif" font-size="14" fill="#2D2A4A">องครักษ์</text>

  <!-- City: Nakhon Nayok -->
  <circle cx="610" cy="170" r="11" fill="#A51931" stroke="#2D2A4A" stroke-width="1.5"/>
  <text x="580" y="150" font-family="Sarabun, sans-serif" font-size="15" fill="#2D2A4A" font-weight="bold">นครนายก</text>

  <!-- Legend -->
  <rect x="60" y="470" width="220" height="70" fill="#E8EEF7" stroke="#6B7280" stroke-width="1"/>
  <text x="70" y="488" font-family="Sarabun, sans-serif" font-size="13" fill="#2D2A4A" font-weight="bold">สัญลักษณ์เส้นทาง</text>
  <line x1="70" y1="500" x2="100" y2="500" stroke="#6B7280" stroke-width="5"/>
  <text x="105" y="504" font-family="Sarabun, sans-serif" font-size="12" fill="#2D2A4A">ทางหลวง 1 (แนวประมาณ)</text>
  <line x1="70" y1="515" x2="100" y2="515" stroke="#1F4E79" stroke-width="5"/>
  <text x="105" y="519" font-family="Sarabun, sans-serif" font-size="12" fill="#2D2A4A">ทางหลวง 305</text>
  <line x1="70" y1="530" x2="100" y2="530" stroke="#A51931" stroke-width="5"/>
  <text x="105" y="534" font-family="Sarabun, sans-serif" font-size="12" fill="#2D2A4A">ทางหลวง 33</text>

  <!-- Compass -->
  <g transform="translate(700,120)">
    <circle cx="0" cy="0" r="28" fill="#FFFFFF" stroke="#2D2A4A" stroke-width="1.5"/>
    <polygon points="0,-22 6,0 0,10 -6,0" fill="#A51931"/>
    <text x="0" y="-30" font-family="Sarabun, sans-serif" font-size="13" fill="#2D2A4A" text-anchor="middle" font-weight="bold">N</text>
  </g>

  <!-- Scale bar -->
  <g transform="translate(520,560)">
    <text x="0" y="-8" font-family="Sarabun, sans-serif" font-size="12" fill="#2D2A4A">มาตราส่วนโดยประมาณ (กม.)</text>
    <line x1="0" y1="0" x2="150" y2="0" stroke="#2D2A4A" stroke-width="2"/>
    <line x1="0" y1="-5" x2="0" y2="5" stroke="#2D2A4A" stroke-width="2"/>
    <line x1="75" y1="-5" x2="75" y2="5" stroke="#2D2A4A" stroke-width="2"/>
    <line x1="150" y1="-5" x2="150" y2="5" stroke="#2D2A4A" stroke-width="2"/>
    <text x="0" y="18" font-family="Sarabun, sans-serif" font-size="11" fill="#2D2A4A">0</text>
    <text x="65" y="18" font-family="Sarabun, sans-serif" font-size="11" fill="#2D2A4A">25</text>
    <text x="140" y="18" font-family="Sarabun, sans-serif" font-size="11" fill="#2D2A4A">50</text>
  </g>

  <!-- Note -->
  <text x="60" y="600" font-family="Sarabun, sans-serif" font-size="12" fill="#6B7280">
    หมายเหตุ: ภาพประกอบ ไม่ใช่แบบก่อสร้าง แผนผังนี้เป็นการแสดงเส้นทางโดยสังเขปเพื่อการอ้างอิงเท่านั้น
  </text>
</svg>