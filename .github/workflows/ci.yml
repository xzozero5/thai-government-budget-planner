name: ci

# ทุก push/PR — ไม่มี secret ใด ๆ, ไม่รัน eval, ไม่รัน pipeline กับ raw data (docs/07-TESTING.md §5)
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # T-307 M5: supply chain — fail เมื่อ dependency ที่ถูก bundle มีช่องโหว่ระดับ high ขึ้นไป
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: ตรวจว่า dist/index.html มี CSP meta
        run: grep -q 'http-equiv="Content-Security-Policy"' dist/index.html
      - name: ตรวจว่า production bundle ไม่มี harness/fake client ของ eval (T-306)
        run: |
          if grep -rlE "__evalHarness|__ai-eval|createFakeAnthropicClient|installToolCapture" dist --include=*.js --include=*.html; then
            echo "พบโค้ด harness ใน production bundle" && exit 1
          fi
      - name: Guard N2 — VITE_EVAL_ANTHROPIC_API_KEY ต้องไม่ถูก inline เข้า bundle (T-306)
        run: npm run guard:n2
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
